name: news-cycle

# The production scheduler: a full cycle every ~2 hours (collect → dedup → rank → draft → publish).
# Runs entirely in GitHub's cloud against Supabase; no local machine involved.
# Primary trigger: Supabase pg_cron → GitHub workflow_dispatch every 2 h (see src/ainews/dispatcher.py),
# because GitHub's own schedule dropped hourly slots for 7+ hours. The hourly `schedule` below is a
# backup; a cheap gate runs the full cycle only when ≥ 1.75 h passed since the last successful one.
# Exact timing is not guaranteed.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Why this manual run (shown in the run list)"
        required: false
        default: "manual"
      force:
        description: "Run even if the last cycle was < 1.75 h ago (the pg_cron trigger sends false)"
        required: false
        default: "true"

concurrency:
  group: news-cycle        # never two cycles at once (the DB advisory lock is the second guard)
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DASHBOARD_DB_PASSWORD: ${{ secrets.DASHBOARD_DB_PASSWORD }}
      # Non-secret settings: repository *variables* (Settings → Secrets and variables → Variables).
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'AI-новости (рабочее название)' }}
      TELEGRAM_TARGET: ${{ vars.TELEGRAM_TARGET || 'telegram:main' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL || 'gemini-embedding-001' }}
      GEMINI_COMPOSE_MODEL: ${{ vars.GEMINI_COMPOSE_MODEL || '' }}
      LLM_DAILY_REQUEST_LIMIT: ${{ vars.LLM_DAILY_REQUEST_LIMIT || '150' }}
      PUBLISH_THRESHOLD: ${{ vars.PUBLISH_THRESHOLD || '55' }}
      MAIN_THRESHOLD: ${{ vars.MAIN_THRESHOLD || '80' }}
      DAILY_DIGEST_HOUR: ${{ vars.DAILY_DIGEST_HOUR || '21' }}
      HTTP_USER_AGENT: "AINewsRuBot/0.1 (RSS reader; +https://github.com/${{ github.repository }})"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt && pip install --no-deps .
      - name: Is a cycle due?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif python -m ainews due --min-hours 1.75; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"; echo "Not due yet — skipping this hourly slot."
          fi
      - name: Check configuration
        if: steps.due.outputs.due == 'true'
        run: |
          test -n "$DATABASE_URL" || { echo "::error::secret DATABASE_URL is not set"; exit 1; }
          case "$DATABASE_URL" in *:6543/*) echo "::error::use the Supabase SESSION pooler (port 5432), not the transaction pooler (6543)"; exit 1;; esac
          test -n "$GEMINI_API_KEY" || echo "::warning::GEMINI_API_KEY not set — AI stages will be skipped"
          if [ "$DRY_RUN" != "true" ]; then test -n "$TELEGRAM_BOT_TOKEN" -a -n "$TELEGRAM_CHAT_ID" || { echo "::error::Telegram secrets missing while DRY_RUN=false"; exit 1; }; fi
      - name: Migrate database
        if: steps.due.outputs.due == 'true'
        run: alembic upgrade head
      - name: Database privileges
        if: steps.due.outputs.due == 'true'
        run: |
          python -m ainews grant-dashboard
          python -m ainews check-privileges
      - name: Run cycle
        if: steps.due.outputs.due == 'true'
        run: python -m ainews cycle --trigger "${{ github.event_name }}"
      - name: Export recent posts for review
        if: always() && steps.due.outputs.due == 'true'
        run: python -m ainews show-posts --out out/posts.md || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.due.outputs.due == 'true'
        with:
          name: posts-${{ github.run_id }}
          path: out/posts.md
          retention-days: 14
          if-no-files-found: ignore
