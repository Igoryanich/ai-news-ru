name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: newsbot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e . && pip check
      - run: ruff check src tests migrations
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/newsbot
      - name: Migrations on PostgreSQL (up / check / down / up) + Supabase-style lockdown
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/newsbot
          PGPASSWORD: test
          DASHBOARD_DB_PASSWORD: ci-only-dashboard-password-0123456789
        run: |
          psql -h localhost -U postgres -d newsbot -c "DROP SCHEMA IF EXISTS newsbot CASCADE; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          python -m ainews check-privileges
          python -m ainews grant-dashboard
          # the read-only role can read but not write
          PGPASSWORD=$DASHBOARD_DB_PASSWORD psql -h localhost -U newsbot_dashboard -d newsbot -c "SELECT count(*) FROM newsbot.runs"
          ! PGPASSWORD=$DASHBOARD_DB_PASSWORD psql -h localhost -U newsbot_dashboard -d newsbot -v ON_ERROR_STOP=1 -c "INSERT INTO newsbot.kv(key, value, updated_at) VALUES ('x', '{}', now())"
