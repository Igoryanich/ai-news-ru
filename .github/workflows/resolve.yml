name: resolve-publication

# Manual recovery for a publication in state `uncertain` (unknown Telegram outcome) or `failed`.
# 1) Open the channel and check whether the post is there.
# 2) Run this workflow: "sent" (it is there — optionally give its message id), "retry" (it is
#    NOT there — send on the next cycle) or "cancel" (never send).

on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: "Publication id (see dashboard → Публикации). retry on a dry_run post = approve it for sending"
        required: true
      action:
        description: "Decision"
        required: true
        type: choice
        options: [sent, retry, cancel]
      message_id:
        description: "Telegram message id (optional, for action=sent)"
        required: false

concurrency:
  group: news-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt && pip install --no-deps .
      - name: Resolve
        env:
          PUB_ID: ${{ inputs.publication_id }}
          ACTION: ${{ inputs.action }}
          MSG_ID: ${{ inputs.message_id }}
        run: |
          case "$PUB_ID" in ''|*[!0-9]*) echo "::error::publication_id must be a number"; exit 1;; esac
          if [ -n "$MSG_ID" ]; then
            case "$MSG_ID" in *[!0-9]*) echo "::error::message_id must be a number"; exit 1;; esac
            python -m ainews resolve "$PUB_ID" "$ACTION" --message-id "$MSG_ID"
          else
            python -m ainews resolve "$PUB_ID" "$ACTION"
          fi
