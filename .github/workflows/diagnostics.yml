name: diagnostics

# Manual live checks of the cloud configuration. Secrets stay inside the runner; the output
# contains only non-secret facts (model answers, cosine values, bot/channel names, rights).

on:
  workflow_dispatch:
    inputs:
      check:
        description: "What to check"
        required: true
        type: choice
        options: [telegram-check, ai-check, backup-llm-check, sources-check, show-posts, stories-report, usage]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL || 'gemini-embedding-001' }}
      HTTP_USER_AGENT: "AINewsRuBot/0.1 (RSS reader; +https://github.com/${{ github.repository }})"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt && pip install --no-deps .
      - run: python -m ainews ${{ inputs.check }}
      - uses: actions/upload-artifact@v4
        if: inputs.check == 'show-posts' || inputs.check == 'stories-report'
        with:
          name: posts-${{ github.run_id }}
          path: out/posts.md
          retention-days: 14
