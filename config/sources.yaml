  - {key: gn-ai, name: Google News · artificial intelligence, kind: gnews, category: media, authority: 0.55, ai_only: false, url: "https://news.google.com/rss/search?q=%22artificial+intelligence%22+when:1d&hl=en-US&gl=US&ceid=US:en"}
  - {key: gn-ai-ru, name: Google News · ИИ (рус.), kind: gnews, category: media, authority: 0.55, url: "https://news.google.com/rss/search?q=%D0%BD%D0%B5%D0%B9%D1%80%D0%BE%D1%81%D0%B5%D1%82%D1%8C+OR+%22%D0%B8%D1%81%D0%BA%D1%83%D1%81%D1%81%D1%82%D0%B2%D0%B5%D0%BD%D0%BD%D1%8B%D0%B9+%D0%B8%D0%BD%D1%82%D0%B5%D0%BB%D0%BB%D0%B5%D0%BA%D1%82%22+when:1d&hl=ru&gl=RU&ceid=RU:ru"}

