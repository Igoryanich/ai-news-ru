[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ainews-ru"
version = "0.1.0"
description = "Autonomous Russian-language AI news pipeline for Telegram"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7",
  "beautifulsoup4>=4.12,<5",
  "PyYAML>=6,<7",
  "rapidfuzz>=3.10,<4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.11,<1", "uvicorn>=0.34,<1"]

[project.scripts]
ainews = "ainews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits real external services (run explicitly with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
